<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Golda Mesenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --neon: #00ff88;
  --neon-dim: rgba(0, 255, 136, 0.15);
  --bg: #050505;
  --surface: #121212;
  --surface-glass: rgba(18, 18, 18, 0.85);
  --text: #ffffff;
  --text-sec: #888888;
  --danger: #ff3b5c;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 4px; }

/* AUTH */
.auth-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: radial-gradient(circle at 50% 0%, #0a2a1a 0%, var(--bg) 60%); }
.auth-box { background: var(--surface-glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.auth-box h1 { color: var(--neon); text-align: center; font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; text-shadow: 0 0 20px rgba(0,255,136,0.4); }
.auth-box .sub { text-align: center; color: var(--text-sec); margin-bottom: 28px; font-size: 14px; }
.input-group { margin-bottom: 16px; }
.input-group input { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; transition: 0.3s; }
.input-group input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px var(--neon-dim); }
.btn-primary { width: 100%; padding: 16px; background: var(--neon); color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.auth-switch { text-align: center; margin-top: 20px; color: var(--text-sec); font-size: 14px; }
.auth-switch span { color: var(--neon); font-weight: 600; cursor: pointer; }
.err { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: center; background: rgba(255,59,92,0.1); padding: 10px; border-radius: 8px; display: none; }

/* APP LAYOUT */
.app { display: none; height: 100vh; flex-direction: column; }
.view { display: none; flex-direction: column; height: 100%; }
.view.active { display: flex; }

/* HEADER */
.header { padding: 16px 20px; background: var(--surface-glass); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
.header h2 { font-size: 22px; font-weight: 700; color: var(--neon); letter-spacing: -0.5px; }
.icon-btn { background: rgba(255,255,255,0.05); border: none; color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.icon-btn:active { background: var(--neon-dim); color: var(--neon); }

/* CHAT LIST */
.chat-list { flex: 1; overflow-y: auto; padding: 8px; }
.chat-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
.chat-item:active { background: rgba(255,255,255,0.05); }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #1a1a1a, #2a2a2a); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--neon); font-size: 18px; overflow: hidden; flex-shrink: 0; position: relative; border: 2px solid rgba(255,255,255,0.05); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.status-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); }
.status-online { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.status-offline { background: #444; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-last { font-size: 14px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: var(--neon); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; font-weight: bold; box-shadow: 0 8px 24px rgba(0,255,136,0.3); cursor: pointer; border: none; z-index: 20; }
.fab:active { transform: scale(0.9); }

/* CHAT VIEW */
.chat-header { padding: 12px 16px; background: var(--surface-glass); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
.chat-header .back-btn { font-size: 20px; padding: 8px; margin-right: -8px; }
.chat-header .info { flex: 1; }
.chat-header .name { font-weight: 600; font-size: 16px; }
.chat-header .status { font-size: 12px; color: var(--neon); }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
.msg.me { align-self: flex-end; background: var(--neon); color: #000; border-bottom-right-radius: 4px; }
.msg.other { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 4px; }
.msg .time { font-size: 10px; opacity: 0.7; text-align: right; margin-top: 4px; }
.msg-input-wrap { padding: 12px 16px; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; align-items: center; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.msg-input-wrap input { flex: 1; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; color: var(--text); font-size: 16px; outline: none; }
.msg-input-wrap input:focus { border-color: var(--neon); }
.msg-input-wrap button { width: 48px; height: 48px; background: var(--neon); border: none; border-radius: 50%; color: #000; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* MODAL */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: #1a1a1a; border-radius: 24px 24px 0 0; width: 100%; max-width: 500px; padding: 24px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { color: var(--neon); margin-bottom: 20px; font-size: 20px; }
.modal label { display: block; color: var(--text-sec); font-size: 12px; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.modal input, .modal textarea { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; }
.modal textarea { min-height: 80px; resize: none; }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-secondary { flex: 1; padding: 14px; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-weight: 600; cursor: pointer; }
.btn-danger { background: rgba(255,59,92,0.15); color: var(--danger); border: 1px solid rgba(255,59,92,0.3); }

/* ADMIN & UTILS */
.admin-row { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
.admin-row .info b { color: var(--neon); display: block; margin-bottom: 4px; }
.admin-row .info small { color: var(--text-sec); font-size: 12px; }
.admin-row button { padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 6px; }
.user-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; }
.user-row:active { background: rgba(255,255,255,0.05); }
.menu { position: absolute; right: 16px; top: 60px; background: #222; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 6px; z-index: 50; min-width: 180px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.menu.show { display: block; }
.menu-item { padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
.menu-item:active { background: rgba(255,255,255,0.05); }
.menu-item.danger { color: var(--danger); }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <h1>GOLDA</h1>
    <div class="sub">Premium Neon Messenger</div>
    <div id="authErr" class="err"></div>
    
    <div id="loginForm">
      <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="loginPass" placeholder="Пароль"></div>
      <button class="btn-primary" onclick="doLogin()">Войти</button>
      <div class="auth-switch">Нет аккаунта? <span onclick="showRegister()">Создать</span></div>
    </div>
    
    <div id="registerForm" style="display:none">
      <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Пароль (мин. 6 символов)"></div>
      <div class="input-group"><input type="text" id="regUsername" placeholder="Юзернейм (латиница, цифры, _)"></div>
      <div class="input-group"><input type="text" id="regName" placeholder="Отображаемое имя"></div>
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
      <div class="auth-switch">Есть аккаунт? <span onclick="showLogin()">Войти</span></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <!-- VIEW 1: CHAT LIST -->
  <div id="viewList" class="view active">
    <div class="header">
      <h2>GOLDA</h2>
      <div style="display:flex;gap:8px">
        <button id="adminBtn" class="icon-btn" onclick="openAdmin()" style="display:none">⚙️</button>
        <button class="icon-btn" onclick="openProfile()">👤</button>
      </div>
    </div>
    <div id="chatList" class="chat-list"></div>
    <button class="fab" onclick="openNewChat()">+</button>
  </div>

  <!-- VIEW 2: CHAT -->
  <div id="viewChat" class="view">
    <div class="chat-header">
      <button class="icon-btn back-btn" onclick="showView('viewList')">←</button>
      <div class="avatar" id="chatAvatar" style="width:40px;height:40px;font-size:16px"></div>
      <div class="info" onclick="openChatPartnerProfile()">
        <div class="name" id="chatName">Имя</div>
        <div class="status" id="chatStatus">не в сети</div>
      </div>
      <button class="icon-btn" onclick="toggleChatMenu(event)">⋮</button>
      <div id="chatMenu" class="menu">
        <div class="menu-item" onclick="openChatPartnerProfile()">👁 Профиль</div>
        <div class="menu-item danger" onclick="deleteCurrentChat()">🗑 Удалить чат</div>
        <div class="menu-item danger" onclick="blockCurrentPartner()">🚫 Заблокировать</div>
      </div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="msg-input-wrap">
      <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modalContent" class="modal"></div>
</div>

<script>
const SUPABASE_URL = 'https://rbmosvfrstupvtkpjptm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XeRKQIpdjNmXlxtnNJ1kBg_Uw2-NZX1';
const ADMIN_EMAIL = 'levshlapa919@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null, currentChatId = null, currentChatType = null, currentPartnerId = null;
let msgSub = null, onlineUsers = new Set();

function showErr(msg) { const e = document.getElementById('authErr'); e.textContent = msg; e.style.display = 'block'; }
function hideErr() { document.getElementById('authErr').style.display = 'none'; }
function showRegister() { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; hideErr(); }
function showLogin() { document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; hideErr(); }
function showView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }

async function doLogin() {
  hideErr();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return showErr('Заполни все поля');
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showErr(error.message);
  await initApp();
}

async function doRegister() {
  hideErr();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const name = document.getElementById('regName').value.trim();
  
  if (!email || !pass || !username) return showErr('Заполни все поля');
  if (pass.length < 6) return showErr('Пароль мин. 6 символов');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showErr('Юзернейм: 3-20 символов (a-z, 0-9, _)');
  
  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { username, display_name: name || username } }
  });
  if (error) return showErr(error.message);
  if (!data.session) return showErr('Аккаунт создан! Проверь почту или отключи подтверждение в Supabase.');
  await initApp();
}

async function initApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  
  const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (pErr || !profile) return showErr('Ошибка профиля. Выполни SQL-скрипт в Supabase!');
  
  if (session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && profile.role !== 'admin') {
    await sb.from('profiles').update({ role: 'admin' }).eq('id', session.user.id);
    profile.role = 'admin';
  }
  
  if (profile.banned) { await sb.auth.signOut(); return alert('Ты заблокирован'); }
  
  me = profile;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (me.role === 'admin') document.getElementById('adminBtn').style.display = 'flex';
  
  loadChats();
  subscribePresence();
}

async function loadChats() {
  const { data: members } = await sb.from('chat_members').select('chat_id, chat:chats(id,type,name,avatar_url,created_by)').eq('user_id', me.id);
  const chats = (members || []).map(m => m.chat).filter(Boolean);
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  
  if (chats.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-sec)">Нет чатов. Нажми + чтобы начать!</div>';
    return;
  }
  
  for (const chat of chats) {
    const { name, avatar, statusText, partnerId } = await getChatInfo(chat);
    const { data: lastMsg } = await sb.from('messages').select('content,sender_id').eq('chat_id', chat.id).order('created_at', { ascending: false }).limit(1);
    const lastText = lastMsg && lastMsg[0] ? (lastMsg[0].sender_id === me.id ? 'Вы: ' : '') + lastMsg[0].content.slice(0, 35) : 'Нет сообщений';
    
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(chat.id, chat.type, partnerId);
    div.innerHTML = `
      <div class="avatar">${avatar ? `<img src="${avatar}">` : (name[0]||'?').toUpperCase()}
        ${chat.type==='private' ? `<div class="status-dot ${statusText==='в сети'?'status-online':'status-offline'}"></div>` : ''}
      </div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(name)}</div>
        <div class="chat-last">${escapeHtml(lastText)}</div>
      </div>`;
    list.appendChild(div);
  }
}

async function getChatInfo(chat) {
  if (chat.type === 'group') return { name: chat.name || 'Группа', avatar: chat.avatar_url, statusText: '', partnerId: null };
  const { data: members } = await sb.from('chat_members').select('user_id').eq('chat_id', chat.id);
  const partnerId = (members || []).map(m => m.user_id).find(id => id !== me.id);
  if (!partnerId) return { name: 'Неизвестный', avatar: null, statusText: '', partnerId: null };
  const { data: p } = await sb.from('profiles').select('display_name,avatar_url').eq('id', partnerId).single();
  return { name: p?.display_name || 'Пользователь', avatar: p?.avatar_url, statusText: onlineUsers.has(partnerId) ? 'в сети' : 'не в сети', partnerId };
}

async function openChat(chatId, type, partnerId) {
  currentChatId = chatId; currentChatType = type; currentPartnerId = partnerId;
  const { name, avatar, statusText } = await getChatInfo({ id: chatId, type });
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatStatus').textContent = statusText;
  document.getElementById('chatAvatar').innerHTML = avatar ? `<img src="${avatar}">` : (name[0]||'?').toUpperCase();
  
  const { data } = await sb.from('messages').select('*,sender:profiles(display_name)').eq('chat_id', chatId).order('created_at', { ascending: true });
  const box = document.getElementById('messages');
  box.innerHTML = '';
  (data || []).forEach(m => {
    const isMe = m.sender_id === me.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    const sender = (type === 'group' && !isMe && m.sender) ? `<div style="font-size:12px;color:var(--neon);margin-bottom:4px">${escapeHtml(m.sender.display_name)}</div>` : '';
    box.innerHTML += `<div class="msg ${isMe ? 'me' : 'other'}">${sender}${escapeHtml(m.content)}<div class="time">${time}</div></div>`;
  });
  box.scrollTop = box.scrollHeight;
  
  if (msgSub) msgSub.unsubscribe();
  msgSub = sb.channel('msgs_' + chatId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, payload => {
    const m = payload.new;
    const isMe = m.sender_id === me.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    box.innerHTML += `<div class="msg ${isMe ? 'me' : 'other'}">${escapeHtml(m.content)}<div class="time">${time}</div></div>`;
    box.scrollTop = box.scrollHeight;
    loadChats(); // Обновить превью последнего сообщения
  }).subscribe();
  
  showView('viewChat');
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content || !currentChatId) return;
  input.value = '';
  await sb.from('messages').insert({ chat_id: currentChatId, sender_id: me.id, content });
}

function subscribePresence() {
  const channel = sb.channel('presence_online', { config: { presence: { key: me.id } } })
    .on('presence', { event: 'sync' }, () => {
      onlineUsers = new Set(Object.keys(channel.presenceState()));
      loadChats();
    }).subscribe(async status => {
      if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() });
    });
}

/* --- ACTIONS --- */
async function openNewChat() {
  const { data: users } = await sb.from('profiles').select('id,username,display_name,avatar_url').neq('id', me.id);
  showModal(`<h3>Новый чат</h3>
    <input type="text" id="userSearch" placeholder="Поиск..." oninput="filterUsers(this.value)" style="width:100%;margin-bottom:16px">
    <div id="usersList" style="max-height:60vh;overflow-y:auto"></div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
  window._allUsers = users || [];
  filterUsers('');
}

function filterUsers(q) {
  const filtered = window._allUsers.filter(u => u.display_name.toLowerCase().includes(q.toLowerCase()) || u.username.includes(q.toLowerCase()));
  document.getElementById('usersList').innerHTML = filtered.map(u => `
    <div class="user-row" onclick="startChat('${u.id}')">
      <div class="avatar" style="width:40px;height:40px;font-size:16px">${u.avatar_url ? `<img src="${u.avatar_url}">` : u.display_name[0].toUpperCase()}</div>
      <div><div style="font-weight:600">${escapeHtml(u.display_name)}</div><div style="font-size:12px;color:var(--text-sec)">@${escapeHtml(u.username)}</div></div>
    </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--text-sec)">Не найдено</div>';
}

async function startChat(partnerId) {
  const { data, error } = await sb.rpc('get_or_create_private_chat', { user1: me.id, user2: partnerId });
  if (error) return alert(error.message);
  closeModal();
  const { data: chat } = await sb.from('chats').select('*').eq('id', data).single();
  if (chat) { loadChats(); openChat(chat.id, chat.type, partnerId); }
}

function toggleChatMenu(e) { e.stopPropagation(); document.getElementById('chatMenu').classList.toggle('show'); }
document.addEventListener('click', () => document.getElementById('chatMenu')?.classList.remove('show'));

async function deleteCurrentChat() {
  if (!confirm('Удалить чат?')) return;
  await sb.from('chat_members').delete().eq('chat_id', currentChatId).eq('user_id', me.id);
  currentChatId = null; showView('viewList'); loadChats();
}

async function blockCurrentPartner() {
  if (!currentPartnerId || !confirm('Заблокировать?')) return;
  await sb.from('blocks').insert({ blocker_id: me.id, blocked_id: currentPartnerId });
  deleteCurrentChat(); alert('Заблокирован');
}

async function openChatPartnerProfile() {
  if (!currentPartnerId) return;
  const { data: p } = await sb.from('profiles').select('*').eq('id', currentPartnerId).single();
  if (!p) return;
  showModal(`<div style="text-align:center">
    <div class="avatar" style="width:80px;height:80px;font-size:32px;margin:0 auto 16px">${p.avatar_url ? `<img src="${p.avatar_url}">` : p.display_name[0].toUpperCase()}</div>
    <h3 style="margin-bottom:4px">${escapeHtml(p.display_name)}</h3>
    <div style="color:var(--text-sec);margin-bottom:16px">@${escapeHtml(p.username)}</div>
    <div style="background:rgba(255,255,255,0.05);padding:16px;border-radius:12px;text-align:left;font-size:14px">${p.about || 'О себе пусто'}</div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>
  </div>`);
}

async function openProfile() {
  showModal(`<h3>Мой профиль</h3>
    <label>Имя</label><input type="text" id="pfName" value="${escapeHtml(me.display_name)}">
    <label>Юзернейм</label><input type="text" id="pfUsername" value="${escapeHtml(me.username)}">
    <label>О себе</label><textarea id="pfAbout">${escapeHtml(me.about)}</textarea>
    <div class="modal-actions">
      <button class="btn-secondary btn-danger" onclick="doLogout()">Выйти</button>
      <button class="btn-primary" style="flex:1" onclick="saveProfile()">Сохранить</button>
    </div>`);
}

async function saveProfile() {
  const name = document.getElementById('pfName').value.trim();
  const username = document.getElementById('pfUsername').value.trim().toLowerCase();
  const about = document.getElementById('pfAbout').value.trim();
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return alert('Неверный юзернейм');
  const { error } = await sb.from('profiles').update({ display_name: name, username, about }).eq('id', me.id);
  if (error) return alert(error.message);
  me = { ...me, display_name: name, username, about };
  closeModal(); loadChats();
}

async function doLogout() { await sb.auth.signOut(); location.reload(); }

/* --- ADMIN --- */
async function openAdmin() {
  if (me.role !== 'admin') return;
  showModal(`<h3>⚙️ Админ-панель</h3>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn-secondary" style="flex:1" onclick="adminTab('hist')">📜 История</button>
      <button class="btn-secondary" style="flex:1" onclick="adminTab('users')">👥 Юзеры</button>
    </div>
    <div id="adminContent" style="max-height:50vh;overflow-y:auto"></div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
  adminTab('hist');
}

async function adminTab(tab) {
  const box = document.getElementById('adminContent');
  if (tab === 'hist') {
    const { data } = await sb.from('registration_history').select('*').order('registered_at', { ascending: false });
    box.innerHTML = (data || []).map(r => `<div class="admin-row"><div class="info"><b>@${escapeHtml(r.username)}</b><small>${escapeHtml(r.email)}</small></div><small>${new Date(r.registered_at).toLocaleDateString('ru')}</small></div>`).join('') || 'Пусто';
  } else {
    const { data } = await sb.from('profiles').select('*');
    box.innerHTML = (data || []).map(u => `<div class="admin-row">
      <div class="info"><b>@${escapeHtml(u.username)}</b><small>${u.role} ${u.banned ? '🚫 БАН' : ''}</small></div>
      <div>${u.id !== me.id ? `<button style="background:var(--danger);color:#fff" onclick="adminBan('${u.id}',${!u.banned})">${u.banned ? 'Разбан' : 'Бан'}</button>` : 'ТЫ'}</div>
    </div>`).join('');
  }
}

async function adminBan(userId, unban) {
  if (!confirm(unban ? 'Разбанить?' : 'Забанить?')) return;
  await sb.from('profiles').update({ banned: !unban }).eq('id', userId);
  adminTab('users');
}

/* --- UTILS --- */
function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// Auto-login
(async () => { const { data: { session } } = await sb.auth.getSession(); if (session) initApp(); })();
