<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Golda Mesenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
:root { --bg: #0a0f0a; --surface: #111811; --border: #1a2a1a; --neon: #00ff88; --neon-dim: rgba(0,255,136,0.1); --text: #fff; --text-sec: #6a8a6a; --danger: #ff3b5c; }
body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.auth-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; animation: fadeIn 0.5s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.auth-box { width: 100%; max-width: 400px; animation: slideUp 0.6s; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.logo { font-size: 48px; font-weight: 900; text-align: center; margin-bottom: 40px; letter-spacing: -2px; }
.logo .diamond { color: var(--neon); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } }
.input-group { margin-bottom: 16px; }
.input-group input { width: 100%; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; transition: 0.3s; }
.input-group input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px var(--neon-dim); }
.btn-primary { width: 100%; padding: 16px; background: var(--neon); color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.auth-switch { text-align: center; margin-top: 20px; color: var(--text-sec); font-size: 14px; }
.auth-switch span { color: var(--neon); font-weight: 600; cursor: pointer; }
.err { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: center; background: rgba(255,59,92,0.1); padding: 12px; border-radius: 8px; display: none; animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.app { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.5s; }
.view { display: none; flex-direction: column; height: 100%; }
.view.active { display: flex; animation: slideIn 0.3s; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.header .logo { font-size: 32px; margin-bottom: 0; }
.header-icons { display: flex; gap: 12px; }
.icon-btn { width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: 0.2s; }
.icon-btn:active { background: var(--neon-dim); border-color: var(--neon); transform: scale(0.95); }
.actions { padding: 20px; display: flex; gap: 12px; }
.action-btn { flex: 1; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.action-btn:active { background: var(--neon-dim); border-color: var(--neon); transform: scale(0.98); }
.search-wrap { padding: 0 20px 20px; }
.search-input { width: 100%; padding: 14px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: 0.3s; }
.search-input:focus { border-color: var(--neon); }
.chats-section { padding: 0 20px; margin-bottom: 12px; }
.section-title { font-size: 13px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
.chat-list { flex: 1; overflow-y: auto; padding: 0 20px; }
.chat-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; animation: slideUp 0.4s; }
.chat-item:active { background: var(--surface); transform: scale(0.98); }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--neon); font-size: 18px; overflow: hidden; flex-shrink: 0; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.status-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); }
.status-online { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.status-offline { background: #444; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.chat-last { font-size: 14px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sec); font-size: 16px; animation: fadeIn 0.6s; }
.profile-bar { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 14px; background: var(--surface); cursor: pointer; transition: 0.2s; }
.profile-bar:active { background: var(--neon-dim); }
.profile-bar .avatar { width: 44px; height: 44px; }
.profile-info { flex: 1; }
.profile-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
.profile-status { font-size: 13px; color: var(--neon); display: flex; align-items: center; gap: 6px; }
.profile-status::before { content: ''; width: 8px; height: 8px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 8px var(--neon); }
.chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
.chat-header .back-btn { font-size: 24px; padding: 8px; margin-right: -8px; }
.chat-header .info { flex: 1; }
.chat-header .name { font-weight: 600; font-size: 16px; }
.chat-header .status { font-size: 13px; color: var(--neon); }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; animation: msgAppear 0.3s; }
@keyframes msgAppear { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.msg.me { align-self: flex-end; background: var(--neon); color: #000; border-bottom-right-radius: 4px; }
.msg.other { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg .time { font-size: 11px; opacity: 0.7; text-align: right; margin-top: 4px; }
.msg-input-wrap { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.msg-input-wrap input { flex: 1; padding: 14px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; color: var(--text); font-size: 15px; outline: none; transition: 0.3s; }
.msg-input-wrap input:focus { border-color: var(--neon); }
.msg-input-wrap button { width: 48px; height: 48px; background: var(--neon); border: none; border-radius: 50%; color: #000; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.msg-input-wrap button:active { transform: scale(0.9); }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; animation: fadeIn 0.3s; }
.modal { background: var(--surface); border-radius: 24px 24px 0 0; width: 100%; max-width: 500px; padding: 24px; max-height: 85vh; overflow-y: auto; animation: slideUpModal 0.4s; }
@keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { color: var(--neon); margin-bottom: 20px; font-size: 22px; }
.modal label { display: block; color: var(--text-sec); font-size: 12px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.modal input, .modal textarea { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: 0.3s; }
.modal input:focus, .modal textarea:focus { border-color: var(--neon); }
.modal textarea { min-height: 80px; resize: none; }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-secondary { flex: 1; padding: 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-secondary:active { background: var(--neon-dim); border-color: var(--neon); }
.btn-danger { background: rgba(255,59,92,0.15); color: var(--danger); border-color: rgba(255,59,92,0.3); }
.avatar-upload { text-align: center; margin-bottom: 20px; }
.avatar-preview { width: 100px; height: 100px; border-radius: 50%; background: var(--bg); border: 3px dashed var(--border); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-sec); cursor: pointer; overflow: hidden; transition: 0.3s; position: relative; }
.avatar-preview:active { border-color: var(--neon); transform: scale(0.95); }
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-preview .upload-hint { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 4px; font-size: 10px; color: var(--neon); }
.admin-row { padding: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; animation: slideUp 0.3s; }
.admin-row .info b { color: var(--neon); display: block; margin-bottom: 4px; }
.admin-row .info small { color: var(--text-sec); font-size: 12px; }
.admin-row button { padding: 8px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 6px; transition: 0.2s; }
.admin-row button:active { transform: scale(0.95); }
.user-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
.user-row:active { background: var(--surface); transform: scale(0.98); }
.menu { position: absolute; right: 16px; top: 70px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px; z-index: 50; min-width: 180px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.2s; }
.menu.show { display: block; }
.menu-item { padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; }
.menu-item:active { background: var(--neon-dim); }
.menu-item.danger { color: var(--danger); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 4px; }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <div class="logo">G<span class="diamond">◆</span>LDA</div>
    <div id="authErr" class="err"></div>
    <div id="loginForm">
      <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="loginPass" placeholder="Пароль"></div>
      <button class="btn-primary" onclick="doLogin()">Войти</button>
      <div class="auth-switch">Нет аккаунта? <span onclick="showRegister()">Создать</span></div>
    </div>
    <div id="registerForm" style="display:none">
      <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Пароль (мин. 6 символов)"></div>
      <div class="input-group"><input type="text" id="regUsername" placeholder="Юзернейм"></div>
      <div class="input-group"><input type="text" id="regName" placeholder="Отображаемое имя"></div>
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
      <div class="auth-switch">Есть аккаунт? <span onclick="showLogin()">Войти</span></div>
    </div>
  </div>
</div>

<div id="app" class="app">
  <div id="viewList" class="view active">
    <div class="header">
      <div class="logo">G<span class="diamond">◆</span>LDA</div>
      <div class="header-icons">
        <button class="icon-btn" onclick="openProfile()">👤</button>
        <button id="adminBtn" class="icon-btn" onclick="openAdmin()" style="display:none">️</button>
        <button class="icon-btn" onclick="doLogout()">🚪</button>
      </div>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="openNewChat()"> Новый чат</button>
      <button class="action-btn" onclick="openNewGroup()"> Группа</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" placeholder=" Поиск..." oninput="filterChats(this.value)">
    </div>
    <div class="chats-section"><div class="section-title">ЧАТЫ</div></div>
    <div id="chatList" class="chat-list"></div>
    <div class="profile-bar" onclick="openProfile()">
      <div class="avatar" id="myAvatar"></div>
      <div class="profile-info">
        <div class="profile-name" id="myName">Имя</div>
        <div class="profile-status">в сети</div>
      </div>
    </div>
  </div>

  <div id="viewChat" class="view">
    <div class="chat-header">
      <button class="icon-btn back-btn" onclick="showView('viewList')">←</button>
      <div class="avatar" id="chatAvatar" style="width:40px;height:40px;font-size:16px"></div>
      <div class="info" onclick="openChatPartnerProfile()">
        <div class="name" id="chatName">Имя</div>
        <div class="status" id="chatStatus">не в сети</div>
      </div>
      <button class="icon-btn" onclick="toggleChatMenu(event)">⋮</button>
      <div id="chatMenu" class="menu">
        <div class="menu-item" onclick="openChatPartnerProfile()">👁 Профиль</div>
        <div class="menu-item danger" onclick="deleteCurrentChat()">🗑 Удалить чат</div>
        <div class="menu-item danger" onclick="blockCurrentPartner()">🚫 Заблокировать</div>
      </div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="msg-input-wrap">
      <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" onkeypress="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()"></button>
    </div>
  </div>
</div>

<div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modalContent" class="modal"></div>
</div>

<script>
const SUPABASE_URL = 'https://rbmosvfrstupvtkpjptm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XeRKQIpdjNmXlxtnNJ1kBg_Uw2-NZX1';
const ADMIN_EMAIL = 'levshlapa919@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null, currentChatId = null, currentChatType = null, currentPartnerId = null;
let msgSub = null, onlineUsers = new Set(), allChats = [];

function showErr(msg) { const e = document.getElementById('authErr'); e.textContent = msg; e.style.display = 'block'; }
function hideErr() { document.getElementById('authErr').style.display = 'none'; }
function showRegister() { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; hideErr(); }
function showLogin() { document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; hideErr(); }
function showView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }

async function doLogin() {
  hideErr();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return showErr('Заполни все поля');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showErr(error.message);
  await initApp();
}

async function doRegister() {
  hideErr();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const name = document.getElementById('regName').value.trim();
  if (!email || !pass || !username) return showErr('Заполни все поля');
  if (pass.length < 6) return showErr('Пароль мин. 6 символов');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showErr('Юзернейм: 3-20 символов (a-z, 0-9, _)');
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { username, display_name: name || username } } });
  if (error) return showErr(error.message);
  if (!data.session) return showErr('Проверь почту или отключи подтверждение в Supabase');
  await initApp();
}

async function initApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (pErr || !profile) return showErr('Ошибка профиля. Выполни SQL в Supabase!');
  if (session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && profile.role !== 'admin') {
    await sb.from('profiles').update({ role: 'admin' }).eq('id', session.user.id);
    profile.role = 'admin';
  }
  if (profile.banned) { await sb.auth.signOut(); return alert('Ты заблокирован'); }
  me = profile;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (me.role === 'admin') document.getElementById('adminBtn').style.display = 'flex';
  document.getElementById('myName').textContent = me.display_name;
  document.getElementById('myAvatar').innerHTML = me.avatar_url ? `<img src="${me.avatar_url}">` : me.display_name[0].toUpperCase();
  loadChats();
  subscribePresence();
}

async function loadChats() {
  const { data: members } = await sb.from('chat_members').select('chat_id, chat:chats(id,type,name,avatar_url,created_by)').eq('user_id', me.id);
  allChats = (members || []).map(m => m.chat).filter(Boolean);
  renderChatList(allChats);
}

async function renderChatList(chats) {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  if (chats.length === 0) { list.innerHTML = '<div class="empty-state">Пока пусто</div>'; return; }
  for (const chat of chats) {
    const { name, avatar, statusText, partnerId } = await getChatInfo(chat);
    const { data: lastMsg } = await sb.from('messages').select('content,sender_id').eq('chat_id', chat.id).order('created_at', { ascending: false }).limit(1);
    const lastText = lastMsg && lastMsg[0] ? (lastMsg[0].sender_id === me.id ? 'Вы: ' : '') + lastMsg[0].content.slice(0, 35) : 'Нет сообщений';
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(chat.id, chat.type, partnerId);
    div.innerHTML = `<div class="avatar">${avatar ? `<img src="${avatar}">` : (name[0]||'?').toUpperCase()}${chat.type==='private' ? `<div class="status-dot ${statusText==='в сети'?'status-online':'status-offline'}"></div>` : ''}</div><div class="chat-info"><div class="chat-name">${escapeHtml(name)}</div><div class="chat-last">${escapeHtml(lastText)}</div></div>`;
    list.appendChild(div);
  }
}

function filterChats(q) {
  const filtered = allChats.filter(c => {
    const name = c.name || '';
    return name.toLowerCase().includes(q.toLowerCase());
  });
  renderChatList(filtered);
}

async function getChatInfo(chat) {
  if (chat.type === 'group') return { name: chat.name || 'Группа', avatar: chat.avatar_url, statusText: '', partnerId: null };
  const { data: members } = await sb.from('chat_members').select('user_id').eq('chat_id', chat.id);
  const partnerId = (members || []).map(m => m.user_id).find(id => id !== me.id);
  if (!partnerId) return { name: 'Неизвестный', avatar: null, statusText: '', partnerId: null };
  const { data: p } = await sb.from('profiles').select('display_name,avatar_url').eq('id', partnerId).single();
  return { name: p?.display_name || 'Пользователь', avatar: p?.avatar_url, statusText: onlineUsers.has(partnerId) ? 'в сети' : 'не в сети', partnerId };
}

// ИСПРАВЛЕННАЯ ФУНКЦИЯ - БЕЗ JOIN С PROFILES
async function openChat(chatId, type, partnerId) {
  currentChatId = chatId; currentChatType = type; currentPartnerId = partnerId;
  const { name, avatar, statusText } = await getChatInfo({ id: chatId, type });
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatStatus').textContent = statusText;
  document.getElementById('chatAvatar').innerHTML = avatar ? `<img src="${avatar}">` : (name[0]||'?').toUpperCase();
  
  // Загружаем сообщения БЕЗ join
  const { data, error } = await sb.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
  if (error) { console.error('Ошибка загрузки сообщений:', error); alert('Ошибка: ' + error.message); return; }
  
  // Загружаем профили отправителей отдельно
  const senderIds = [...new Set((data || []).map(m => m.sender_id))];
  let profilesMap = {};
  if (senderIds.length > 0) {
    const { data: profiles } = await sb.from('profiles').select('id, display_name').in('id', senderIds);
    (profiles || []).forEach(p => { profilesMap[p.id] = p.display_name; });
  }
  
  const box = document.getElementById('messages');
  box.innerHTML = '';
  (data || []).forEach(m => {
    const isMe = m.sender_id === me.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    const senderName = profilesMap[m.sender_id] || 'Неизвестный';
    const sender = (type === 'group' && !isMe) ? `<div style="font-size:12px;color:var(--neon);margin-bottom:4px">${escapeHtml(senderName)}</div>` : '';
    box.innerHTML += `<div class="msg ${isMe ? 'me' : 'other'}">${sender}${escapeHtml(m.content)}<div class="time">${time}</div></div>`;
  });
  box.scrollTop = box.scrollHeight;
  
  if (msgSub) msgSub.unsubscribe();
  msgSub = sb.channel('msgs_' + chatId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, async payload => {
    const m = payload.new;
    const isMe = m.sender_id === me.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    let senderName = 'Неизвестный';
    if (!isMe) {
      const { data: p } = await sb.from('profiles').select('display_name').eq('id', m.sender_id).single();
      if (p) senderName = p.display_name;
    }
    const sender = (type === 'group' && !isMe) ? `<div style="font-size:12px;color:var(--neon);margin-bottom:4px">${escapeHtml(senderName)}</div>` : '';
    box.innerHTML += `<div class="msg ${isMe ? 'me' : 'other'}">${sender}${escapeHtml(m.content)}<div class="time">${time}</div></div>`;
    box.scrollTop = box.scrollHeight;
    loadChats();
  }).subscribe();
  
  showView('viewChat');
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;
  if (!currentChatId) { alert('Ошибка: не выбран чат'); return; }
  const { data, error } = await sb.from('messages').insert({ chat_id: currentChatId, sender_id: me.id, content });
  if (error) { console.error('Ошибка отправки:', error); alert('Ошибка: ' + error.message); return; }
  input.value = '';
}

function subscribePresence() {
  const channel = sb.channel('presence_online', { config: { presence: { key: me.id } } })
    .on('presence', { event: 'sync' }, () => { onlineUsers = new Set(Object.keys(channel.presenceState())); loadChats(); })
    .subscribe(async status => { if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() }); });
}

async function openNewChat() {
  showModal(`<h3>Новый чат</h3><input type="text" id="userSearch" placeholder="Введи юзернейм для поиска..." oninput="searchUsers(this.value)" style="width:100%;margin-bottom:16px" autofocus><div id="usersList" style="max-height:60vh;overflow-y:auto"><div style="padding:20px;text-align:center;color:var(--text-sec)">Введи юзернейм чтобы найти человека</div></div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
}

async function searchUsers(query) {
  const list = document.getElementById('usersList');
  if (!query || query.length < 2) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sec)">Введи минимум 2 символа</div>'; return; }
  list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sec)">Поиск...</div>';
  const { data: users, error } = await sb.from('profiles').select('id,username,display_name,avatar_url').neq('id', me.id).or(`username.ilike.%${query}%,display_name.ilike.%${query}%`).limit(20);
  if (error) { console.error('Ошибка поиска:', error); list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger)">Ошибка поиска</div>'; return; }
  if (!users || users.length === 0) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sec)">Никого не найдено</div>'; return; }
  list.innerHTML = users.map(u => `<div class="user-row" onclick="startChat('${u.id}')"><div class="avatar" style="width:40px;height:40px;font-size:16px">${u.avatar_url ? `<img src="${u.avatar_url}">` : u.display_name[0].toUpperCase()}</div><div><div style="font-weight:600">${escapeHtml(u.display_name)}</div><div style="font-size:12px;color:var(--text-sec)">@${escapeHtml(u.username)}</div></div></div>`).join('');
}

async function startChat(partnerId) {
  const { data, error } = await sb.rpc('get_or_create_private_chat', { user1: me.id, user2: partnerId });
  if (error) { console.error('Ошибка создания чата:', error); return alert('Ошибка: ' + error.message); }
  closeModal();
  const { data: chat } = await sb.from('chats').select('*').eq('id', data).single();
  if (chat) { await loadChats(); openChat(chat.id, chat.type, partnerId); }
}

async function openNewGroup() {
  const { data: users } = await sb.from('profiles').select('id,username,display_name,avatar_url').neq('id', me.id);
  window._groupUsers = users || [];
  window._selectedGroupMembers = new Set();
  showModal(`<h3>Создать группу</h3><label>Название</label><input type="text" id="groupName" placeholder="Название группы"><label>Участники</label><div id="groupMembersList" style="max-height:40vh;overflow-y:auto;margin-top:12px"></div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Отмена</button><button class="btn-primary" style="flex:1" onclick="createGroup()">Создать</button></div>`);
  renderGroupMembers();
}

function renderGroupMembers() {
  document.getElementById('groupMembersList').innerHTML = window._groupUsers.map(u => `<label class="user-row"><input type="checkbox" value="${u.id}" onchange="toggleGroupMember('${u.id}')" style="margin-right:12px"><div class="avatar" style="width:40px;height:40px;font-size:16px">${u.avatar_url ? `<img src="${u.avatar_url}">` : u.display_name[0].toUpperCase()}</div><div><div style="font-weight:600">${escapeHtml(u.display_name)}</div><div style="font-size:12px;color:var(--text-sec)">@${u.username}</div></div></label>`).join('');
}

function toggleGroupMember(id) { if (window._selectedGroupMembers.has(id)) window._selectedGroupMembers.delete(id); else window._selectedGroupMembers.add(id); }

async function createGroup() {
  const name = document.getElementById('groupName').value.trim();
  if (!name) return alert('Введи название');
  const members = [me.id, ...window._selectedGroupMembers];
  const { data: chat, error } = await sb.from('chats').insert({ type: 'group', name, created_by: me.id }).select().single();
  if (error) return alert(error.message);
  await sb.from('chat_members').insert(members.map(uid => ({ chat_id: chat.id, user_id: uid })));
  closeModal();
  loadChats();
  openChat(chat.id, 'group', null);
}

function toggleChatMenu(e) { e.stopPropagation(); document.getElementById('chatMenu').classList.toggle('show'); }
document.addEventListener('click', () => document.getElementById('chatMenu')?.classList.remove('show'));

async function deleteCurrentChat() {
  if (!confirm('Удалить чат?')) return;
  await sb.from('chat_members').delete().eq('chat_id', currentChatId).eq('user_id', me.id);
  currentChatId = null; showView('viewList'); loadChats();
}

async function blockCurrentPartner() {
  if (!currentPartnerId || !confirm('Заблокировать?')) return;
  await sb.from('blocks').insert({ blocker_id: me.id, blocked_id: currentPartnerId });
  deleteCurrentChat(); alert('Заблокирован');
}

async function openChatPartnerProfile() {
  if (!currentPartnerId) return;
  const { data: p } = await sb.from('profiles').select('*').eq('id', currentPartnerId).single();
  if (!p) return;
  showModal(`<div style="text-align:center"><div class="avatar" style="width:80px;height:80px;font-size:32px;margin:0 auto 16px">${p.avatar_url ? `<img src="${p.avatar_url}">` : p.display_name[0].toUpperCase()}</div><h3 style="margin-bottom:4px">${escapeHtml(p.display_name)}</h3><div style="color:var(--text-sec);margin-bottom:16px">@${escapeHtml(p.username)}</div><div style="background:var(--bg);padding:16px;border-radius:12px;text-align:left;font-size:14px">${p.about || 'О себе пусто'}</div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div></div>`);
}

async function openProfile() {
  showModal(`<h3>Мой профиль</h3><div class="avatar-upload"><div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarFile').click()">${me.avatar_url ? `<img src="${me.avatar_url}">` : 'Загрузить фото'}<div class="upload-hint">Нажми для загрузки</div></div><input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="previewAvatar(event)"></div><label>Имя</label><input type="text" id="pfName" value="${escapeHtml(me.display_name)}"><label>Юзернейм</label><input type="text" id="pfUsername" value="${escapeHtml(me.username)}"><label>О себе</label><textarea id="pfAbout">${escapeHtml(me.about)}</textarea><div class="modal-actions"><button class="btn-secondary btn-danger" onclick="doLogout()">Выйти</button><button class="btn-primary" style="flex:1" onclick="saveProfile()">Сохранить</button></div>`);
}

function previewAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('avatarPreview').innerHTML = `<img src="${ev.target.result}"><div class="upload-hint">Изменить</div>`; window._newAvatarData = ev.target.result; };
  reader.readAsDataURL(file);
}

async function saveProfile() {
  const name = document.getElementById('pfName').value.trim();
  const username = document.getElementById('pfUsername').value.trim().toLowerCase();
  const about = document.getElementById('pfAbout').value.trim();
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return alert('Неверный юзернейм');
  let avatar_url = me.avatar_url;
  if (window._newAvatarData) {
    const path = `${me.id}/${Date.now()}.png`;
    const base64 = window._newAvatarData.split(',')[1];
    const { error: upErr } = await sb.storage.from('avatars').upload(path, Uint8Array.from(atob(base64), c => c.charCodeAt(0)), { contentType: 'image/png', upsert: true });
    if (upErr) return alert('Ошибка загрузки: ' + upErr.message);
    const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
    avatar_url = urlData.publicUrl;
  }
  const { error } = await sb.from('profiles').update({ display_name: name, username, about, avatar_url }).eq('id', me.id);
  if (error) return alert(error.message);
  me = { ...me, display_name: name, username, about, avatar_url };
  document.getElementById('myName').textContent = name;
  document.getElementById('myAvatar').innerHTML = avatar_url ? `<img src="${avatar_url}">` : name[0].toUpperCase();
  window._newAvatarData = null;
  closeModal();
  loadChats();
}

async function doLogout() { await sb.auth.signOut(); location.reload(); }

async function openAdmin() {
  if (me.role !== 'admin') return;
  showModal(`<h3>⚙️ Админ-панель</h3><div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn-secondary" style="flex:1" onclick="adminTab('hist')">📜 История</button><button class="btn-secondary" style="flex:1" onclick="adminTab('users')">👥 Юзеры</button></div><div id="adminContent" style="max-height:50vh;overflow-y:auto"></div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>`);
  adminTab('hist');
}

async function adminTab(tab) {
  const box = document.getElementById('adminContent');
  if (tab === 'hist') {
    const { data } = await sb.from('registration_history').select('*').order('registered_at', { ascending: false });
    box.innerHTML = (data || []).map(r => `<div class="admin-row"><div class="info"><b>@${escapeHtml(r.username)}</b><small>${escapeHtml(r.email)}</small></div><small>${new Date(r.registered_at).toLocaleDateString('ru')}</small></div>`).join('') || 'Пусто';
  } else {
    const { data } = await sb.from('profiles').select('*');
    box.innerHTML = (data || []).map(u => `<div class="admin-row"><div class="info"><b>@${escapeHtml(u.username)}</b><small>${u.role} ${u.banned ? '🚫 БАН' : ''}</small></div><div>${u.id !== me.id ? `<button style="background:var(--danger);color:#fff" onclick="adminBan('${u.id}',${!u.banned})">${u.banned ? 'Разбан' : 'Бан'}</button>` : 'ТЫ'}</div></div>`).join('');
  }
}

async function adminBan(userId, unban) { if (!confirm(unban ? 'Разбанить?' : 'Забанить?')) return; await sb.from('profiles').update({ banned: !unban }).eq('id', userId); adminTab('users'); }

function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

(async () => { const { data: { session } } = await sb.auth.getSession(); if (session) initApp(); })();
</script>
</body>
</html>
