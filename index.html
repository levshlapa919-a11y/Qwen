<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golda Mesenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
body { background: #0a0f0a; color: #fff; min-height: 100vh; }
.auth-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.auth-box { width: 100%; max-width: 400px; }
.logo { font-size: 48px; font-weight: 900; text-align: center; margin-bottom: 40px; letter-spacing: -2px; }
.logo .diamond { color: #00ff88; display: inline-block; }
.input-group { margin-bottom: 16px; }
.input-group input { width: 100%; padding: 16px 20px; background: #111811; border: 1px solid #1a2a1a; border-radius: 12px; color: #fff; font-size: 16px; outline: none; }
.input-group input:focus { border-color: #00ff88; }
.btn-primary { width: 100%; padding: 16px; background: #00ff88; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-primary:active { opacity: 0.8; }
.auth-switch { text-align: center; margin-top: 20px; color: #6a8a6a; font-size: 14px; }
.auth-switch span { color: #00ff88; cursor: pointer; }
.err { color: #ff3b5c; font-size: 13px; margin-bottom: 12px; text-align: center; background: rgba(255,59,92,0.1); padding: 12px; border-radius: 8px; display: none; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="logo">G<span class="diamond">◆</span>LDA</div>
    <div id="authErr" class="err"></div>
    
    <div id="loginForm">
      <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="loginPass" placeholder="Пароль"></div>
      <button class="btn-primary" id="loginBtn">Войти</button>
      <div class="auth-switch">Нет аккаунта? <span id="toReg">Создать</span></div>
    </div>
    
    <div id="registerForm" style="display:none">
      <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Пароль"></div>
      <div class="input-group"><input type="text" id="regUsername" placeholder="Юзернейм"></div>
      <div class="input-group"><input type="text" id="regName" placeholder="Имя"></div>
      <button class="btn-primary" id="regBtn">Создать аккаунт</button>
      <div class="auth-switch">Есть аккаунт? <span id="toLogin">Войти</span></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rbmosvfrstupvtkpjptm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XeRKQIpdjNmXlxtnNJ1kBg_Uw2-NZX1';
const ADMIN_EMAIL = 'levshlapa919@gmail.com';

console.log('=== ИНИЦИАЛИЗАЦИЯ ===');
console.log('URL:', SUPABASE_URL);
console.log('Ключ:', SUPABASE_ANON_KEY.substring(0, 20) + '...');

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showErr(msg) { 
  const e = document.getElementById('authErr'); 
  e.textContent = msg; 
  e.style.display = 'block';
  console.log('ОШИБКА:', msg);
}
function hideErr() { document.getElementById('authErr').style.display = 'none'; }

// Кнопка ВОЙТИ
document.getElementById('loginBtn').addEventListener('click', async function() {
  console.log('=== НАЖАТА КНОПКА ВОЙТИ ===');
  hideErr();
  
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  
  console.log('Email:', email);
  console.log('Пароль:', pass ? '***' : '(пусто)');
  
  if (!email || !pass) {
    showErr('Заполни все поля');
    return;
  }
  
  console.log('Вызов signInWithPassword...');
  
  try {
    const { data, error } = await sb.auth.signInWithPassword({ 
      email: email, 
      password: pass 
    });
    
    if (error) {
      console.error('Ошибка авторизации:', error);
      showErr(error.message);
      return;
    }
    
    console.log('Успешный вход!', data);
    showErr('');
    alert('Вход выполнен! Переход в приложение...');
    
    // Здесь будет переход в приложение
    // await initApp();
    
  } catch (err) {
    console.error('Исключение:', err);
    showErr('Неожиданная ошибка: ' + err.message);
  }
});

// Кнопка СОЗДАТЬ
document.getElementById('regBtn').addEventListener('click', async function() {
  console.log('=== НАЖАТА КНОПКА СОЗДАТЬ ===');
  hideErr();
  
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const name = document.getElementById('regName').value.trim();
  
  if (!email || !pass || !username) {
    showErr('Заполни все поля');
    return;
  }
  
  if (pass.length < 6) {
    showErr('Пароль мин. 6 символов');
    return;
  }
  
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showErr('Юзернейм: 3-20 символов (a-z, 0-9, _)');
    return;
  }
  
  console.log('Регистрация:', email, username);
  
  try {
    const { data, error } = await sb.auth.signUp({ 
      email: email, 
      password: pass, 
      options: { data: { username: username, display_name: name || username } } 
    });
    
    if (error) {
      console.error('Ошибка регистрации:', error);
      showErr(error.message);
      return;
    }
    
    console.log('Регистрация успешна!', data);
    
    if (!data.session) {
      showErr('Проверь почту или отключи подтверждение в Supabase');
      return;
    }
    
    alert('Аккаунт создан!');
    
  } catch (err) {
    console.error('Исключение:', err);
    showErr('Неожиданная ошибка: ' + err.message);
  }
});

// Переключение форм
document.getElementById('toReg').addEventListener('click', function() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  hideErr();
});

document.getElementById('toLogin').addEventListener('click', function() {
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  hideErr();
});

console.log('=== СКРИПТ ЗАГРУЖЕН ===');
</script>
</body>
</html>
